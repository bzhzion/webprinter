name: build-and-push

on:
  # Declenchement automatique uniquement si du code reellement deploye change : un
  # commit qui ne touche que la doc racine ou les tests ne relance plus le build.
  # Piege GitHub : branches/tags ET paths-ignore sont combines, donc un tag pose sur
  # un commit purement documentaire ne declenche pas non plus -> declenchement manuel.
  push:
    branches: [ "main" ]
    tags: [ "*" ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'tests/**'
      - 'test_*.py'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v6
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
